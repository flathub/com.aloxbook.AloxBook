app-id: com.aloxbook.AloxBook
tags:
  - proprietary
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: AloxBook

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

modules:
  - name: aloxbook
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -a AloxBook *.so* /app/bin/
      - install -Dm644 THIRD-PARTY-NOTICES.txt /app/share/doc/AloxBook/THIRD-PARTY-NOTICES.txt
      - install -d /app/share/doc/AloxBook/ThirdPartyNotices
      - install -m644 ThirdPartyNotices/* /app/share/doc/AloxBook/ThirdPartyNotices/
      - install -Dm644 app_icon.png /app/share/icons/hicolor/256x256/apps/com.aloxbook.AloxBook.png
      - install -Dm644 app_icon.png /app/share/icons/hicolor/256x256/mimetypes/com.aloxbook.AloxBook-x-aloxbook.png
      - install -Dm644 com.aloxbook.AloxBook.desktop /app/share/applications/com.aloxbook.AloxBook.desktop
      - install -Dm644 com.aloxbook.AloxBook.metainfo.xml /app/share/metainfo/com.aloxbook.AloxBook.metainfo.xml
      - install -Dm644 com.aloxbook.AloxBook.mime.xml /app/share/mime/packages/com.aloxbook.AloxBook.mime.xml
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://www.aloxbook.com/downloads/flatpak/AloxBook-2.5.0-linux-x64.tar.xz
        sha256: e492dd5d14102f393b8783229a705558ff2d4128aefd52b01c2022de63878ef9
        strip-components: 0
        x-checker-data:
          type: json
          url: https://www.aloxbook.com/releases/flathub-latest.json
          version-query: .version
          url-query: .sources.x86_64.url
          is-main-source: true

      - type: archive
        only-arches:
          - aarch64
        url: https://www.aloxbook.com/downloads/flatpak/AloxBook-2.5.0-linux-arm64.tar.xz
        sha256: e9587d1eb4c17afbe0a769372f1008f8559239ccc9b72f82126200db84bd9f7a
        strip-components: 0
        x-checker-data:
          type: json
          url: https://www.aloxbook.com/releases/flathub-latest.json
          version-query: .version
          url-query: .sources.aarch64.url
